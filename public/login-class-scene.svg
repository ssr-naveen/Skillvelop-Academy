  <!-- graduation cap -->
  <g opacity=".4" transform="translate(1352 128) rotate(-8)">
    <path d="M0 28L62 0l62 28-62 28z" fill="#ffffff" fill-opacity=".34"/>
    <path d="M26 41v28c0 11 16 19 36 19s36-8 36-19V41" stroke="#ffffff" stroke-opacity=".32" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M120 30v36" stroke="#ff9d90" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="72" r="6" fill="#ff9d90"/>
  </g>

  <!-- pencil -->
  <g opacity=".34" transform="translate(1332 636) rotate(36)">
    <rect x="0" y="0" width="15" height="102" rx="5" fill="#ffffff" fill-opacity=".24"/>
    <path d="M0 102l7.5 24 7.5-24z" fill="#ff9d90" fill-opacity=".85"/>
  </g>
